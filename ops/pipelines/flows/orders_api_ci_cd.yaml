id: orders_api_ci_cd
namespace: cosmotech.clusters.aws_eks_istio_lab_dev
description: Esteira real de orders-api para aws-eks-istio-lab-dev. Sem aprovações. Etapas observam resultados reais do GitHub
  Actions e Argo CD. Logs detalhados pelo link de execução GitHub; falhas não são convertidas em sucesso.
labels:
  cluster: aws-eks-istio-lab-dev
  environment: dev
  application: orders-api
  approval: disabled
inputs:
- id: run_id
  type: STRING
- id: run_attempt
  type: STRING
  defaults: '1'
- id: commit_sha
  type: STRING
tasks:
- id: source_execution
  type: io.kestra.plugin.core.log.Log
  message: Cluster aws-eks-istio-lab-dev | orders-api | commit {{ inputs.commit_sha }} | https://github.com/rlcosmo/cosmotech-orders-api/actions/runs/{{
    inputs.run_id }}/attempts/{{ inputs.run_attempt }}
- id: tests
  type: io.kestra.plugin.scripts.shell.Commands
  containerImage: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: host
    cpu:
      cpus: '0.1'
    memory:
      memory: 128MB
  env:
    PIPELINE_APP: orders-api
    PIPELINE_RUN: '{{ inputs.run_id }}'
    PIPELINE_ATTEMPT: '{{ inputs.run_attempt }}'
    PIPELINE_STAGE: tests
  inputFiles:
    wait_stage.py: "\"\"\"Observe a real CI stage; never execute or approve a deployment.\"\"\"\nimport json\nimport os\n\
      import re\nimport time\nimport urllib.request\n\napp = os.environ['PIPELINE_APP']\nrun_id = os.environ['PIPELINE_RUN']\n\
      attempt = os.environ['PIPELINE_ATTEMPT']\nstage = os.environ['PIPELINE_STAGE']\nassert app in {'orders-api', 'orders-worker',\
      \ 'gitops'}\nassert re.fullmatch(r'[0-9]+', run_id) and re.fullmatch(r'[0-9]+', attempt)\nassert re.fullmatch(r'[a-z_]+',\
      \ stage)\nurl = f'http://127.0.0.1:8094/{app}/{run_id}/{attempt}'\nfor _ in range(360):\n    with urllib.request.urlopen(url,\
      \ timeout=5) as response:\n        record = json.load(response)\n    current = record.get('stages', {}).get(stage, {})\n\
      \    status = current.get('state', 'pending')\n    if status == 'success':\n        print(json.dumps({'stage': stage,\
      \ **current, 'source': record['url'], 'commit': record['sha'], 'cluster': record['cluster']}))\n        break\n    if\
      \ status in {'failure', 'cancelled', 'skipped'} or record.get('state') in {'failure', 'cancelled'}:\n        print(json.dumps({'stage':\
      \ stage, 'state': status, 'pipeline_state': record.get('state'), 'source': record.get('url')}))\n        raise SystemExit('Source\
      \ pipeline did not successfully complete this stage')\n    time.sleep(5)\nelse:\n    raise SystemExit('Timed out waiting\
      \ for actual CI evidence; no success was fabricated')\n"
  commands:
  - python wait_stage.py
