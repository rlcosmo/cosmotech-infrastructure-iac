<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CosmoTech · IaC</title>
<style>body{background:#101b2b;color:#e0eaf4;font:16px system-ui;max-width:1100px;margin:3rem auto;padding:1rem}h1{color:#59dfce}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:1rem;border-bottom:1px solid #456}#status{padding:1rem;background:#20344b}input{margin:1rem 0}</style>
<h1>CosmoTech · Portal IaC</h1><p>Evidências somente leitura. Importe um relatório sanitizado gerado pelo CI. Nenhuma credencial ou estado Terraform é aceito.</p>
<button id="reload">Atualizar histórico autenticado</button><select aria-label="Histórico de observações" id="history"></select><input aria-label="Relatório sanitizado" type="file" accept="application/json"><p id="status">Sem evidência carregada. Estado AWS desconhecido.</p><table><thead><tr><th>Recurso</th><th>Tipo</th><th>Região</th><th>Estado</th></tr></thead><tbody></tbody></table><h2>Candidatos fora deste state</h2><ul></ul>
<script>
const status=document.querySelector('#status');function render(r){try{if(r.schema_version!==1||!Array.isArray(r.resources))throw Error();document.querySelector('tbody').replaceChildren();document.querySelector('ul').replaceChildren();status.textContent=`Observado: ${r.observed_at} · Plan: ${r.last_plan??'desconhecido'} · Apply: ${r.last_apply??'desconhecido'} · Drift: ${r.drift_count??'desconhecido'} · Inventário completo: ${r.inventory_complete}`;for(const row of r.resources){const tr=document.createElement('tr');for(const key of ['address','type','region','status']){const td=document.createElement('td');td.textContent=row[key];tr.append(td)}document.querySelector('tbody').append(tr)}for(const arn of r.unmanaged_candidates){const li=document.createElement('li');li.textContent=arn;document.querySelector('ul').append(li)}}catch{status.textContent='Relatório inválido; nenhuma conclusão disponível.'}};
document.querySelector('input').onchange=async e=>{try{render(JSON.parse(await e.target.files[0].text()))}catch{status.textContent='Relatório inválido'}};
let history=[];document.querySelector('#history').onchange=e=>render(history[Number(e.target.value)]);document.querySelector('#reload').onclick=async()=>{try{const response=await fetch('/api/history',{cache:'no-store'});if(!response.ok)throw Error();history=await response.json();const select=document.querySelector('#history');select.replaceChildren();history.forEach((r,i)=>{const option=document.createElement('option');option.value=i;option.textContent=r.observed_at;select.append(option)});if(history.length){select.value=history.length-1;render(history.at(-1))}else{status.textContent='Sem evidência disponível; estado AWS desconhecido'}}catch{status.textContent='Histórico indisponível; verificar autenticação e coleta'}};
</script></html>
