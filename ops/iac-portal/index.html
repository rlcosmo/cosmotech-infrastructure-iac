<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CosmoTech · IaC</title>
<style>body{background:#101b2b;color:#e0eaf4;font:16px system-ui;max-width:1100px;margin:3rem auto;padding:1rem}h1{color:#59dfce}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:1rem;border-bottom:1px solid #456}#status{padding:1rem;background:#20344b}input{margin:1rem 0}</style>
<h1>CosmoTech · Portal IaC</h1><p>Evidências somente leitura. Importe um relatório sanitizado gerado pelo CI. Nenhuma credencial ou estado Terraform é aceito.</p>
<input aria-label="Relatório sanitizado" type="file" accept="application/json"><p id="status">Sem evidência carregada. Estado AWS desconhecido.</p><table><thead><tr><th>Recurso</th><th>Tipo</th><th>Região</th><th>Estado</th></tr></thead><tbody></tbody></table><h2>Candidatos fora deste state</h2><ul></ul>
<script>
const status=document.querySelector('#status');document.querySelector('input').onchange=async e=>{try{const r=JSON.parse(await e.target.files[0].text());if(r.schema_version!==1||!Array.isArray(r.resources))throw Error();document.querySelector('tbody').replaceChildren();document.querySelector('ul').replaceChildren();status.textContent=`Observado: ${r.observed_at} · Plan: ${r.last_plan??'desconhecido'} · Apply: ${r.last_apply??'desconhecido'} · Drift: ${r.drift_count} · Inventário completo: ${r.inventory_complete}`;for(const row of r.resources){const tr=document.createElement('tr');for(const key of ['address','type','region','status']){const td=document.createElement('td');td.textContent=row[key];tr.append(td)}document.querySelector('tbody').append(tr)}for(const arn of r.unmanaged_candidates){const li=document.createElement('li');li.textContent=arn;document.querySelector('ul').append(li)}}catch{status.textContent='Relatório inválido; nenhuma conclusão disponível.'}};
</script></html>
