name: cosmotech-zabbix
services:
  postgres:
    image: library/postgres@sha256:0b81cec82228160abfa753aeaad0609b709eb26eeb950f2e404ad2326e1cc370
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
    - postgres_password
    volumes:
    - postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U zabbix -d zabbix
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    restart: unless-stopped
    networks:
    - backend
    logging: &id001
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:0805f9f529673d2a68d1fb50dfef90f30f1710bb1b62d4c3f1d1a99d37459ecc
    environment:
      CLICKHOUSE_DB: zabbix
      CLICKHOUSE_USER: zabbix
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    secrets:
    - clickhouse_password
    volumes:
    - clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 6g
    restart: unless-stopped
    networks:
    - backend
    logging: *id001
  server:
    ports:
    - 10051:10051
    image: zabbix/zabbix-server-pgsql@sha256:1bf249a89ec489fca1ac0a3a638ca9d5e667dba415c275fd79e6b55cb83e4cc6
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ZBX_TELEMETRYPROVIDER_0: '{"provider":"clickhouse","url":"http://clickhouse:8123","db":"zabbix"}'
      ZBX_TELEMETRYPROVIDER_0_USERNAME: zabbix
      ZBX_TELEMETRYPROVIDER_0_PASSWORD_FILE: /run/secrets/clickhouse_password
      ZBX_STARTTELEMETRYQUERYPOLLERS: '1'
      ZBX_CACHESIZE: 64M
    secrets:
    - postgres_password
    - clickhouse_password
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped
    networks:
    - backend
    logging: *id001
  web:
    image: cosmotech-v2010-web:8.0.0
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ZBX_TELEMETRYPROVIDER_0: '{"provider":"clickhouse","url":"http://clickhouse:8123","db":"zabbix"}'
      ZBX_TELEMETRYPROVIDER_0_USERNAME: zabbix
      ZBX_TELEMETRYPROVIDER_0_PASSWORD_FILE: /run/secrets/clickhouse_password
      ZBX_SERVER_HOST: server
      ZBX_SERVER_NAME: CosmoTech APM - Zabbix 8.0 LTS
      PHP_TZ: America/Sao_Paulo
      ENABLE_WEB_ACCESS_LOG: 'false'
    secrets:
    - postgres_password
    - clickhouse_password
    ports:
    - 8088:8080
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
      notifications:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped
    networks:
    - backend
    logging: *id001
    build:
      context: /opt/cosmotech/zabbix/v2010
      dockerfile: Dockerfile.web
    pull_policy: never
  proxy:
    image: zabbix/zabbix-proxy-sqlite3@sha256:85083a36eda0d382aaf4111d9d79d026a734d317dcd02a9b6a775115d60ea930
    environment:
      ZBX_TELEMETRYPROVIDER_0: '{"provider":"clickhouse","url":"http://clickhouse:8123","db":"zabbix"}'
      ZBX_TELEMETRYPROVIDER_0_USERNAME: zabbix
      ZBX_TELEMETRYPROVIDER_0_PASSWORD_FILE: /run/secrets/clickhouse_password
      ZBX_PROXYMODE: '0'
      ZBX_SERVER_HOST: server
      ZBX_HOSTNAME: aws-eks-istio-lab-dev-apm
      ZBX_STARTAPMCOLLECTOR: '1'
      ZBX_APMLISTENPORT: '4317'
      ZBX_PROXYCONFIGFREQUENCY: '10'
    secrets:
    - clickhouse_password
    ports:
    - 127.0.0.1:14317:4317
    volumes:
    - proxy:/var/lib/zabbix/db_data
    depends_on:
      server:
        condition: service_started
      clickhouse:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped
    networks:
    - backend
    logging: *id001
  telemetry:
    image: otel/opentelemetry-collector-contrib@sha256:989669581ee1f89184f3fd9dd5adfc6615ed6c9692c026aaea89e07a20dfb177
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - /opt/cosmotech/zabbix/telemetry-collector.yaml:/etc/otelcol/config.yaml:ro
    secrets:
    - clickhouse_password_otel
    ports:
    - 4317:4317
    depends_on:
      clickhouse:
        condition: service_started
    mem_limit: 384m
    restart: unless-stopped
    networks:
    - backend
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  notifications:
    image: cosmotech-v2010-notifications:8.0.0
    build:
      context: /opt/cosmotech/zabbix/v2010
    pull_policy: never
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped
    networks:
    - backend
    volumes:
    - type: bind
      source: /opt/cosmotech/zabbix/notifications
      target: /data
    secrets:
    - source: notifications
      target: notifications
    logging:
      driver: local
      options:
        max-size: 2m
        max-file: '3'
  lab-agent:
    image: zabbix/zabbix-agent2@sha256:ebff3cee33def73ef623700642e2ff0440c183c7393b8d8da4a5fc58fb15f04c
    profiles:
    - v2010-lab
    environment:
      ZBX_HOSTNAME: cosmotech-v2010-isolated-agent
      ZBX_SERVER_HOST: server
      ZBX_PASSIVE_ALLOW: 'true'
      ZBX_ACTIVE_ALLOW: 'false'
    networks:
    - backend
    mem_limit: 96m
    cpus: 0.25
    restart: 'no'
    labels:
      cosmotech.lab: v2-010
networks:
  backend: {}
volumes:
  postgres:
    name: cosmotech-zabbix-postgres
  clickhouse:
    name: cosmotech-zabbix-clickhouse
  proxy:
    name: cosmotech-zabbix-proxy
secrets:
  postgres_password:
    file: /opt/cosmotech/zabbix/secrets/postgres_password
  clickhouse_password:
    file: /opt/cosmotech/zabbix/secrets/clickhouse_password
  clickhouse_password_otel:
    file: /opt/cosmotech/zabbix/secrets/clickhouse_password_otel
  notifications:
    file: /opt/cosmotech/zabbix/secrets/notifications.json
