<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CosmoTech · Incidentes</title><style>body{font:16px system-ui;background:#101b2b;color:#e0eaf4;max-width:1100px;margin:3rem auto;padding:1rem}h1{color:#59dfce}small{color:#b2c3d5}table{width:100%;border-collapse:collapse}td,th{padding:1rem;text-align:left;border-bottom:1px solid #456}tr[data-state=problem]{background:#442b33}button,select{font:inherit;background:#20344b;color:inherit;padding:.6rem;border:1px solid #678;border-radius:6px}.scroll{overflow:auto}#status{padding:1rem;background:#20344b;border-radius:6px}</style><h1>Incidentes do laboratório</h1><p>CosmoTech Solutions · Zabbix · Abertura e recuperação</p><small>Projeção de notificações por sete dias. Histórico completo e correlação permanecem no Zabbix. O horário exibido é o envio da notificação, no seu fuso.</small><p><select id="filter" aria-label="Estado"><option value="all">Todos</option><option value="problem">Abertos</option><option value="recovery">Recuperados</option></select> <button id="refresh">Atualizar</button></p><p id="status" role="status">Carregando…</p><div class="scroll"><table><thead><tr><th>Severidade</th><th>Serviço</th><th>Abertura</th><th>Recuperação</th><th>Estado</th></tr></thead><tbody></tbody></table></div><script>let incidents=[];const labels=['Não classificada','Informação','Atenção','Média','Alta','Desastre'];function render(){const b=document.querySelector('tbody');b.replaceChildren();for(const r of incidents){if(document.querySelector('#filter').value!=='all'&&document.querySelector('#filter').value!==r.state)continue;const tr=document.createElement('tr');tr.dataset.state=r.state;for(const value of [labels[r.severity],r.service,r.opened_at?new Date(r.opened_at*1000).toLocaleString('pt-BR'):'Abertura não recebida',r.recovered_at?new Date(r.recovered_at*1000).toLocaleString('pt-BR'):'—',r.state==='problem'?'Aberto':'Recuperado']){const td=document.createElement('td');td.textContent=value;tr.append(td)}b.append(tr)}}async function load(){try{const r=await fetch('./events',{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error();incidents=(await r.json()).incidents;document.querySelector('#status').textContent=incidents.length+' incidentes · '+incidents.filter(x=>x.state==='problem').length+' abertos';render()}catch{document.querySelector('#status').textContent='Notificações indisponíveis. Verifique a autenticação.'}}document.querySelector('#filter').onchange=render;document.querySelector('#refresh').onclick=load;load();setInterval(load,15000)</script></html>
