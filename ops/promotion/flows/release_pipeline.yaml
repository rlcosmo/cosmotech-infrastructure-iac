inputs:
- id: service
  type: STRING
  required: true
- id: environment
  type: STRING
  required: true
- id: commit
  type: STRING
  required: true
- id: digest
  type: STRING
  required: true
- id: run_id
  type: STRING
  required: true
- id: run_attempt
  type: STRING
  required: true
tasks:
- id: verified_evidence
  type: io.kestra.plugin.scripts.python.Commands
  timeout: PT5M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: host
    cpu:
      cpus: '0.25'
    memory:
      memory: 256MB
  env:
    STAGE: collect
    EXECUTION_ID: '{{ execution.id }}'
    AWS_DEFAULT_REGION: us-east-1
    BEDROCK_PROMOTION_ENABLED: 'false'
  inputFiles:
    stage.py: "import boto3,json,os,time\nfrom botocore.config import Config\nssm=boto3.client('ssm',region_name='us-east-1',config=Config(connect_timeout=3,read_timeout=15,retries={'total_max_attempts':1}))\n\
      instance='i-0def4e806c49cf60e'\ncommand=ssm.send_command(DocumentName='CosmoTech-Execute-Promotion-Stage',InstanceIds=[instance],Parameters={'Stage':[os.environ['STAGE']],'ExecutionId':[os.environ['EXECUTION_ID']]})['Command']['CommandId']\n\
      for attempt in range(115):\n    time.sleep(2)\n    try:\n        result=ssm.get_command_invocation(CommandId=command,InstanceId=instance)\n\
      \    except ssm.exceptions.InvocationDoesNotExist:\n        continue\n    if\
      \ result['Status']=='Success':\n        print('::'+json.dumps({'outputs':json.loads(result['StandardOutputContent'])})+'::')\n\
      \        break\n    if result['Status'] in {'Failed','Cancelled','TimedOut','Cancelling'}:\n\
      \        raise RuntimeError('Trusted stage failed; inspect private SSM evidence\
      \ '+command)\nelse:\n    raise TimeoutError('Stage outcome unresolved; do not\
      \ submit again: '+command)\n"
  containerImage: cosmotech-automation-runner:lab-20261104
  commands:
  - python stage.py
- id: deterministic_policy
  type: io.kestra.plugin.scripts.python.Commands
  timeout: PT5M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: host
    cpu:
      cpus: '0.25'
    memory:
      memory: 256MB
  env:
    STAGE: policy
    EXECUTION_ID: '{{ execution.id }}'
    AWS_DEFAULT_REGION: us-east-1
    BEDROCK_PROMOTION_ENABLED: 'false'
  inputFiles:
    stage.py: "import boto3,json,os,time\nfrom botocore.config import Config\nssm=boto3.client('ssm',region_name='us-east-1',config=Config(connect_timeout=3,read_timeout=15,retries={'total_max_attempts':1}))\n\
      instance='i-0def4e806c49cf60e'\ncommand=ssm.send_command(DocumentName='CosmoTech-Execute-Promotion-Stage',InstanceIds=[instance],Parameters={'Stage':[os.environ['STAGE']],'ExecutionId':[os.environ['EXECUTION_ID']]})['Command']['CommandId']\n\
      for attempt in range(115):\n    time.sleep(2)\n    try:\n        result=ssm.get_command_invocation(CommandId=command,InstanceId=instance)\n\
      \    except ssm.exceptions.InvocationDoesNotExist:\n        continue\n    if\
      \ result['Status']=='Success':\n        print('::'+json.dumps({'outputs':json.loads(result['StandardOutputContent'])})+'::')\n\
      \        break\n    if result['Status'] in {'Failed','Cancelled','TimedOut','Cancelling'}:\n\
      \        raise RuntimeError('Trusted stage failed; inspect private SSM evidence\
      \ '+command)\nelse:\n    raise TimeoutError('Stage outcome unresolved; do not\
      \ submit again: '+command)\n"
  containerImage: cosmotech-automation-runner:lab-20261104
  commands:
  - python stage.py
- id: release_identity
  type: io.kestra.plugin.core.execution.Labels
  labels:
    gmud: '{{ outputs.deterministic_policy.vars.change_id }}'
    gmud_id: '{{ outputs.deterministic_policy.vars.gmud_id }}'
    release: '{{ inputs.service }} | {{ outputs.verified_evidence.vars.version }}
      | {{ outputs.deterministic_policy.vars.gmud_id }}'
    version: '{{ outputs.verified_evidence.vars.version }}'
    application: '{{ inputs.service }}'
- id: human_review
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.deterministic_policy.vars.decision == ''HUMAN_REVIEW'' }}'
  then:
  - id: authenticated_approval
    type: io.kestra.plugin.core.flow.Pause
    description: The portal records the authenticated decision; the persistent reconciler
      resumes. Manual resume grants no approval.
- id: execute_delivery
  type: io.kestra.plugin.scripts.python.Commands
  timeout: PT5M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: host
    cpu:
      cpus: '0.25'
    memory:
      memory: 256MB
  env:
    STAGE: dispatch
    EXECUTION_ID: '{{ execution.id }}'
    AWS_DEFAULT_REGION: us-east-1
    BEDROCK_PROMOTION_ENABLED: 'false'
  inputFiles:
    stage.py: "import boto3,json,os,time\nfrom botocore.config import Config\nssm=boto3.client('ssm',region_name='us-east-1',config=Config(connect_timeout=3,read_timeout=15,retries={'total_max_attempts':1}))\n\
      instance='i-0def4e806c49cf60e'\ncommand=ssm.send_command(DocumentName='CosmoTech-Execute-Promotion-Stage',InstanceIds=[instance],Parameters={'Stage':[os.environ['STAGE']],'ExecutionId':[os.environ['EXECUTION_ID']]})['Command']['CommandId']\n\
      for attempt in range(115):\n    time.sleep(2)\n    try:\n        result=ssm.get_command_invocation(CommandId=command,InstanceId=instance)\n\
      \    except ssm.exceptions.InvocationDoesNotExist:\n        continue\n    if\
      \ result['Status']=='Success':\n        print('::'+json.dumps({'outputs':json.loads(result['StandardOutputContent'])})+'::')\n\
      \        break\n    if result['Status'] in {'Failed','Cancelled','TimedOut','Cancelling'}:\n\
      \        raise RuntimeError('Trusted stage failed; inspect private SSM evidence\
      \ '+command)\nelse:\n    raise TimeoutError('Stage outcome unresolved; do not\
      \ submit again: '+command)\n"
  containerImage: cosmotech-automation-runner:lab-20261104
  commands:
  - python stage.py
- id: acompanhamento_operacional
  type: io.kestra.plugin.core.log.Log
  message: Controle inicial concluído. Canary, validação, observação12h e encerramento
    continuam no portal operacional e scheduler persistente; SUCCESS desta execução
    não encerra a GMUD.
errors:
- id: fail_closed
  type: io.kestra.plugin.core.log.Log
  message: Promoção bloqueada. Consultar a etapa e o motivo no portal. Nenhuma aprovação
    é criada automaticamente em nome de um usuário.
concurrency:
  limit: 2
  behavior: FAIL
id: release_pipeline
namespace: cosmotech.promotion
description: Uma execução principal por release. CI real correlacionada, GLPI e gate;
  Canary e12h acompanhados pelo scheduler persistente e portal.
labels:
  execution_type: release
