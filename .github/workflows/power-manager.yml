name: V2-004 Power Manager
on:
  pull_request:
    paths: ['power_manager/**', 'ops/power-manager/**', 'scripts/*power*', '.github/workflows/power-manager.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy only the isolated Always-On planning stack; never shuts down the lab
        type: boolean
        default: false
permissions: {contents: read}
concurrency:
  group: power-manager-publication
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install boto3==1.43.122 pytest==8.4.2
      - run: python -m pytest power_manager/tests -q
      - run: node power_manager/tests/test_web.mjs
      - run: python scripts/build_power_manager.py
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.17.1, terraform_wrapper: false}
      - run: terraform -chdir=power_manager/terraform fmt -check
      - run: terraform -chdir=power_manager/terraform init -backend=false -input=false
      - run: terraform -chdir=power_manager/terraform validate
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.17.1, terraform_wrapper: false}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.POWER_MANAGER_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: PowerManager-${{ github.run_id }}
          retry-max-attempts: 2
      - name: Prove non-root OIDC identity
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          [[ "$arn" == arn:aws:sts::414053644145:assumed-role/cosmotech-power-deploy/* ]]
          echo "OIDC role verified: $arn" >> "$GITHUB_STEP_SUMMARY"
      - run: python3 scripts/build_power_manager.py
      - run: terraform -chdir=power_manager/terraform init -input=false
      - name: Recover verified post-create log group state
        run: python3 scripts/recover_power_log_group.py
      - name: Plan and enforce scope
        run: |
          umask 077
          terraform -chdir=power_manager/terraform plan -input=false -out=power.plan > /tmp/power-plan.log
          terraform -chdir=power_manager/terraform show -json power.plan > /tmp/power-plan.json
          python3 scripts/check_power_plan.py /tmp/power-plan.json >> "$GITHUB_STEP_SUMMARY"
      - run: terraform -chdir=power_manager/terraform apply -input=false power.plan
      - name: Certify non-root permissions through Step Functions without power changes
        shell: bash
        run: |
          set -euo pipefail
          state_machine=$(terraform -chdir=power_manager/terraform output -raw state_machine_arn)
          execution=$(aws stepfunctions start-execution --state-machine-arn "$state_machine" --name "certify-${{ github.run_id }}-${{ github.run_attempt }}" --input '{"mode":"safe_test"}' --query executionArn --output text)
          for attempt in {1..24}; do
            status=$(aws stepfunctions describe-execution --execution-arn "$execution" --query status --output text)
            if [[ "$status" == SUCCEEDED ]]; then break; fi
            [[ "$status" == RUNNING ]] || { echo "Certification failed: $execution"; exit 1; }
            sleep 5
          done
          [[ "$status" == SUCCEEDED ]]
          complete=$(aws dynamodb get-item --table-name cosmotech-power-control --key '{"pk":{"S":"CERTIFICATION"}}' --consistent-read --query Item.complete.BOOL --output text)
          [[ "$complete" == True ]]
          echo "Safe certification: $execution; no EC2 stop/start/scale applied" >> "$GITHUB_STEP_SUMMARY"
      - name: Endpoint evidence
        run: terraform -chdir=power_manager/terraform output -raw api_endpoint >> "$GITHUB_STEP_SUMMARY"
