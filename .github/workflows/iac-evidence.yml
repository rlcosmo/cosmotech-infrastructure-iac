name: IaC read-only evidence
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: iac-readonly-evidence
  cancel-in-progress: false
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require authorized read-only evidence role
        env:
          EVIDENCE_ROLE: ${{ vars.IAC_EVIDENCE_ROLE_ARN }}
        run: |
          test -n "$EVIDENCE_ROLE" || { echo 'IAC_EVIDENCE_ROLE_ARN is required; the no-refresh plan role is insufficient'; exit 1; }
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAC_EVIDENCE_ROLE_ARN }}
          aws-region: us-east-1
          retry-max-attempts: 2
          role-session-name: LabV2-${{ github.run_id }}
      - name: Resolve public recipient from configured variable or approved runtime
        env:
          CONFIGURED_PUBLIC_KEY: ${{ vars.IAC_EVIDENCE_GPG_PUBLIC_KEY }}
        shell: bash
        run: |
          python3 - <<'PYKEY'
          import json, os, subprocess
          key = os.environ.get('CONFIGURED_PUBLIC_KEY', '')
          if not key:
              result = subprocess.run(['aws', 'ssm', 'get-parameter', '--region', 'us-east-1', '--name', '/cosmotech/lab-v2/evidence-public-key', '--output', 'json'], capture_output=True, check=False)
              if result.returncode:
                  raise SystemExit('Runtime evidence recipient not available; publication bootstrap is required')
              key = json.loads(json.loads(result.stdout)['Parameter']['Value'])['public_key']
          if not key.startswith('-----BEGIN PGP PUBLIC KEY BLOCK-----') or 'PRIVATE KEY' in key:
              raise SystemExit('A public-only GPG recipient is required')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EVIDENCE_PUBLIC_KEY<<PUBLIC_KEY_END\n' + key + '\nPUBLIC_KEY_END\n')
          PYKEY
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_lambda_artifacts.py
      - run: python3 scripts/build_lab_v2_bundle.py
      - run: terraform -chdir=terraform/environments/dev init -input=false
      - name: Observe drift without persisting refreshed state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="$(mktemp -d)"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          terraform -chdir=terraform/environments/dev show -json > "$evidence_dir/state.json"
          terraform -chdir=terraform/environments/dev plan -refresh-only -lock=false -input=false -out="$evidence_dir/drift.plan" > "$evidence_dir/plan.log" 2>&1
          terraform -chdir=terraform/environments/dev show -json "$evidence_dir/drift.plan" > "$evidence_dir/plan.json"
          python3 scripts/collect_iac_inventory.py --region us-east-1 --output "$evidence_dir/inventory.json"
          python3 scripts/build_iac_portal.py --state "$evidence_dir/state.json" --plan "$evidence_dir/plan.json" --inventory "$evidence_dir/inventory.json" --region us-east-1 --output "$evidence_dir/report.json"
      - name: Encrypt private operational evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$EVIDENCE_DIR/gpg"
          printf '%s' "$EVIDENCE_PUBLIC_KEY" > "$EVIDENCE_DIR/recipient.asc"
          gpg --homedir "$EVIDENCE_DIR/gpg" --batch --yes --trust-model always --recipient-file "$EVIDENCE_DIR/recipient.asc" --encrypt --output "$EVIDENCE_DIR/report.json.gpg" "$EVIDENCE_DIR/report.json"
      - name: Deliver encrypted report to the private existing bucket
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          stamp="$(date -u +%Y-%m/%Y%m%dT%H%M%SZ)"
          aws s3api put-object --bucket "aws-serverless-lab-$account-tfstate-use1" --key "lab-v2/iac-evidence/$stamp-$GITHUB_RUN_ID.json.gpg" --server-side-encryption AES256 --body "$EVIDENCE_DIR/report.json.gpg" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: iac-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/report.json.gpg
          retention-days: 14
          if-no-files-found: error
      - name: Remove sensitive temporary evidence
        if: always()
        shell: bash
        run: |
          if [ -n "${EVIDENCE_DIR:-}" ]; then rm -rf -- "$EVIDENCE_DIR"; fi
